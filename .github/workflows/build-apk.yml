name: Compilar APK

# Se puede lanzar a mano desde la pestaña Actions o al hacer push.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.gradle usa `git describe` para la version

      - name: Preparar fuentes (submodulos + espejos vivos)
        run: bash scripts/prepare-sources.sh

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Se hace a mano en vez de con android-actions/setup-android porque esa
      # accion falla de forma intermitente en los runners de GitHub.
      - name: Instalar Android SDK, NDK y CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK base: $SDK"

          if command -v sdkmanager > /dev/null 2>&1; then
            SDKM="sdkmanager"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "== descargando cmdline-tools =="
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" --install \
            "platforms;android-31" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

          echo "== instalado =="
          ls "$SDK/ndk" "$SDK/cmake" 2>/dev/null || true

      - name: Instalar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # assembleDebug deja el paquete como org.citra.emu.debug,
      # asi se instala AL LADO del Citra original (no lo reemplaza ni lo borra).
      - name: Compilar APK (debug)
        working-directory: src/android
        env:
          GRADLE_OPTS: -Xmx4g
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: citra-mmj-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar el log si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-de-compilacion
          path: |
            src/android/app/.cxx/**/*.log
            src/android/build/reports/**
            /home/runner/.gradle/daemon/**/*.log
          if-no-files-found: ignore
